[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mumble-voice-overlay"
version = "1.0.0"
description = "EAC-safe out-of-process voice overlay for Mumble (Star Citizen)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5"]

[project.scripts]
mumble-voice-overlay = "voice_overlay.app:main"

[tool.setuptools]
packages = ["voice_overlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
